<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Product Admin | Signs and Arts</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18110972532"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18110972532');
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-panel" id="loginPanel">
      <div class="login-card">
        <div class="brand">
          <strong>Signs &amp; Arts</strong>
          <span>Product Admin</span>
        </div>
        <label for="adminToken">Admin Token</label>
        <input id="adminToken" type="password" autocomplete="current-password">
        <button class="primary" id="loginButton" type="button">Open Admin</button>
        <div class="notice" id="loginNotice" role="status"></div>
      </div>
    </section>

    <section class="workspace is-hidden" id="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <div class="eyebrow">Catalog</div>
            <h1>Products</h1>
          </div>
          <button class="icon-btn" id="refreshButton" type="button" title="Refresh products">Refresh</button>
        </div>
        <div class="stats">
          <div><span id="totalCount">0</span><small>Total</small></div>
          <div><span id="publishedCount">0</span><small>Published</small></div>
          <div><span id="draftCount">0</span><small>Drafts</small></div>
        </div>
        <div class="list-tools">
          <input id="searchInput" type="search" placeholder="Search products">
          <button class="primary" id="newButton" type="button">New</button>
        </div>
        <div class="product-list" id="productList"></div>
        <button class="ghost signout" id="signOutButton" type="button">Sign Out</button>
      </aside>

      <section class="editor">
        <div class="editor-bar">
          <div>
            <div class="eyebrow" id="editorStatus">Draft</div>
            <h2 id="editorTitle">New Product</h2>
          </div>
          <div class="actions">
            <a class="ghost link-button" id="previewButton" href="/product/" target="_blank" rel="noopener">Preview</a>
            <button class="ghost" id="deleteButton" type="button">Delete</button>
            <button class="secondary" id="unpublishButton" type="button">Unpublish</button>
            <button class="secondary" id="saveButton" type="button">Save</button>
            <button class="primary" id="publishButton" type="button">Publish</button>
          </div>
        </div>

        <form id="productForm" class="form-grid">
          <input type="hidden" id="productId">
          <div class="field span-2">
            <label for="name">Product Name</label>
            <input id="name" required maxlength="180">
          </div>
          <div class="field">
            <label for="slug">URL Slug</label>
            <input id="slug" required maxlength="90">
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>
          </div>
          <div class="field">
            <label for="price">Price</label>
            <input id="price" type="number" min="0" step="1" required>
          </div>
          <div class="field">
            <label for="categoryKey">Category Key</label>
            <select id="categoryKey">
              <option value="medical">Medical / Pharmacy</option>
              <option value="xerox">Xerox / Stationery</option>
              <option value="dental">Dental Clinic</option>
              <option value="optical">Optical Clinic</option>
              <option value="bar">Bar &amp; Restaurant</option>
              <option value="tattoo">Tattoo Studio</option>
              <option value="spa">Spa / Salon</option>
              <option value="decor">Home Decor</option>
              <option value="accessories">LED Accessories</option>
              <option value="retail">Retail / Pan Shop</option>
              <option value="custom">Custom / Any Shop</option>
            </select>
          </div>
          <div class="field">
            <label for="category">Category Label</label>
            <input id="category" maxlength="120">
          </div>
          <div class="field">
            <label for="badge">Badge</label>
            <input id="badge" maxlength="80">
          </div>
          <div class="field">
            <label for="brand">Brand</label>
            <input id="brand" maxlength="120">
          </div>
          <div class="field span-2">
            <label for="title">SEO Title</label>
            <input id="title" maxlength="180">
          </div>
          <div class="field span-2">
            <label for="description">Description</label>
            <textarea id="description" rows="4" maxlength="1200"></textarea>
          </div>
          <div class="field span-2">
            <label for="images">Image URLs</label>
            <textarea id="images" rows="4" spellcheck="false"></textarea>
          </div>
          <div class="field span-2">
            <label for="imageUpload">Upload Images</label>
            <div class="upload-row">
              <input id="imageUpload" type="file" accept="image/jpeg,image/png,image/webp" multiple>
              <button class="secondary" id="uploadImagesButton" type="button">Upload</button>
            </div>
          </div>
          <div class="field">
            <label for="features">Features</label>
            <textarea id="features" rows="8"></textarea>
          </div>
          <div class="field">
            <label for="specs">Specifications</label>
            <textarea id="specs" rows="8" spellcheck="false"></textarea>
          </div>
          <div class="field span-2">
            <label for="tags">Tags</label>
            <input id="tags">
          </div>
        </form>

        <div class="preview-strip">
          <div class="preview-image" id="previewImage"></div>
          <div>
            <div class="eyebrow" id="previewCategory">Custom / Any Shop</div>
            <h3 id="previewName">New Product</h3>
            <p id="previewDescription"></p>
            <strong id="previewPrice">Rs 0</strong>
          </div>
        </div>
        <div class="notice" id="notice" role="status"></div>
      </section>
    </section>
  </main>
  <script src="/admin/app.js"></script>
</body>
</html>
